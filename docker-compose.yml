# docker-compose.yml
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: cng-postgres
    environment:
      POSTGRES_USER: cng_user
      POSTGRES_PASSWORD: cng_pass
      POSTGRES_DB: cng_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
