spring.application.name=cng-navigator

# Server Configuration
server.port=8080

# Out-of-the-box Default Database (H2 in PostgreSQL compatibility mode for instant zero-config Demo Mode)
# Switch to 'postgres' profile with --spring.profiles.active=postgres or set PostgreSQL credentials in .env
spring.datasource.url=jdbc:h2:file:./data/cngdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible in dev/demo mode at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & Admin Key
cng.admin.key=${ADMIN_SECRET_KEY:cng-admin-secret-2026}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
